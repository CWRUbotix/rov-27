name: Documentation
on:
  push:
    branches:
      - main
    paths:
      - "documentation/**"
      - .github/workflows/documentation.yml
  workflow_dispatch:
concurrency:
  group: documentation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync docs to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: documentation/
